<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harry & Carolina - Wedding Invitation</title>

    <!-- Open Graph / Social Media Preview -->
    <meta property="og:title" content="Carolina & Harry - Wedding Invitation">
    <meta property="og:description" content="Domingo, 18 de octubre de 2026 · Madrid, España">
    <meta property="og:image" content="https://cfatuesta.github.io/caroandharry-wedding/og-image.png">
    <meta property="og:url" content="https://cfatuesta.github.io/caroandharry-wedding/invite.html">
    <meta property="og:type" content="website">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Carolina & Harry - Wedding Invitation">
    <meta name="twitter:description" content="Domingo, 18 de octubre de 2026 · Madrid, España">
    <meta name="twitter:image" content="https://cfatuesta.github.io/caroandharry-wedding/og-image.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
        }

        body {
            font-family: 'Cormorant Garamond', sans-serif;
            background-color: #F9F0E1;
            color: #4a3528;
            line-height: 1.6;
            position: relative;
            overflow: hidden;
            height: 100vh;
        }

        /* Video background */
        .video-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            z-index: -2;
            opacity: 0.75;
        }

        /* Light overlay to unify the look */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(249, 240, 225, 0.2);
            pointer-events: none;
            z-index: -1;
        }

        .section {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
        }

        .container {
            text-align: left;
            width: 100%;
            max-width: 600px;
            animation: fadeIn 1.5s ease-out;
            padding: 2.5rem 2rem;
            position: relative;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .invitation-line {
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.85rem;
            font-weight: 400;
            color: #5a4030;
            text-align: left;
            line-height: 1.6;
            margin-top: -1.5rem;
            margin-bottom: 3rem;
            letter-spacing: 0.02em;
        }

        .names {
            text-transform: uppercase;
            font-family: 'Cormorant Garamond', serif;
            font-size: 5.5rem;
            font-weight: 500;
            line-height: 0.95;
            margin-bottom: 1.5rem;
            color: #2e3a1f;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            letter-spacing: -0.02em;
        }

        .ampersand {
            font-size: 7rem;
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-weight: 300;
            color: #C99985;
            margin: 0.0em 0 0.05em 0.05em;
            display: inline-block;
            position: absolute;
            top: 4.3rem;
            left: -5.5rem;
            z-index: 2;
        }

        .vertical-line {
            position: absolute;
            left: -2.2rem;
            top: 0;
            bottom: 0;
            width: 1px;
            z-index: 1;
        }

        /* Split line into two segments to avoid ampersand */
        .vertical-line::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 1px;
            height: 4.5rem;
            background-color: #C99985;
        }

        .vertical-line::after {
            content: '';
            position: absolute;
            top: 11rem;
            left: 0;
            width: 1px;
            bottom: 0;
            background-color: #C99985;
        }

        .date-location-block {
            margin-top: 3rem;
        }

        .date {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.7rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: #4a3528;
            letter-spacing: 0.02em;
        }

        .location {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.3rem;
            font-weight: 500;
            letter-spacing: 0.1rem;
            color: #5a4030;
        }

        .calendar-link {
            display: inline-block;
            margin-top: 3rem;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            font-weight: 400;
            color: #5a4030;
            text-decoration: none;
            border-bottom: 1px solid #C99985;
            padding-bottom: 0.1rem;
            transition: all 0.3s ease;
        }

        .calendar-link:hover {
            color: #4a3528;
            border-bottom-color: #4a3528;
        }

        .lang-toggle {
            margin-top: 3rem;
            display: flex;
            gap: 0.5rem;
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.95rem;
            color: #5a4030;
            opacity: 0.7;
        }

        .lang-toggle button {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            padding: 0;
            transition: all 0.3s ease;
            text-decoration: none;
            font-family: inherit;
            font-size: inherit;
            border-bottom: 1px solid transparent;
        }

        .lang-toggle button:hover {
            color: #4a3528;
            border-bottom-color: #C99985;
        }

        .lang-toggle button.active {
            color: #4a3528;
            font-weight: 500;
            border-bottom-color: #C99985;
        }

        /* RSVP Button */
        .rsvp-btn {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background-color: #4a5a3a;
            color: #fff;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-decoration: none;
            padding: 1.2rem 2.5rem;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(74, 90, 58, 0.4);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .rsvp-btn:hover {
            background-color: #3a4a2a;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(74, 90, 58, 0.5);
        }

        /* Responsive styles */
        @media (max-width: 480px) {
            body {
                padding: 1rem;
                padding-left: 1.25rem;
            }

            .container {
                padding: 2rem 2.5rem 2rem 4rem;
            }

            .names {
                font-size: 2.8rem;
            }

            .ampersand {
                font-size: 3rem;
                top: 3.5rem;
                left: 0rem;
            }

            .vertical-line {
                left: 1.5rem;
            }

            .vertical-line::before {
                height: 3.5rem;
            }

            .vertical-line::after {
                top: 6.5rem;
            }

            .date {
                font-size: 1.2rem;
            }

            .location {
                font-size: 1rem;
            }

            .calendar-link {
                font-size: 1rem;
            }

            .rsvp-btn {
                bottom: 1.5rem;
                right: 1.5rem;
                font-size: 1.2rem;
                padding: 1rem 2rem;
            }
        }
    </style>
</head>

<body>
    <!-- Video Background -->
    <video class="video-bg" autoplay muted loop playsinline id="bgVideo">
        <source src="bg-video3.mp4" type="video/mp4">
    </video>

    <!-- RSVP Button -->
    <a href="https://forms.gle/9eQ67WdH58e4ARca6" target="_blank" rel="noopener noreferrer" class="rsvp-btn" data-en="RSVP" data-es="RSVP">RSVP</a>

    <!-- Hero Section -->
    <section class="section" id="home">
        <main class="container">
            <div class="vertical-line"></div>
            <h1 class="names">
                <span class="name-first">Carolina</span>
                <span class="ampersand">&</span>
                <span>Harry</span>
            </h1>

            <div class="date-location-block">
                <p class="date" data-en="Sunday, October 18th, 2026" data-es="Domingo, 18 de octubre de 2026">Sunday,
                    October 18th, 2026</p>
                <p class="location" data-en="Madrid, Spain" data-es="Madrid, España">Madrid, Spain</p>
            </div>

            <a href="#" class="calendar-link" id="calendarLink" data-en="Click here to add to your calendar"
                data-es="Haz clic aquí para añadirlo a tu calendario">
                Click here to add to your calendar
            </a>

            <div class="lang-toggle">
                <button data-lang="en">English</button>
                <span>/</span>
                <button class="active" data-lang="es">Español</button>
            </div>
        </main>
    </section>

    <script>
        function setLanguage(lang, updateUrl = false) {
            document.querySelectorAll('.lang-toggle button').forEach(b => {
                b.classList.toggle('active', b.dataset.lang === lang);
            });

            document.querySelectorAll('[data-en]').forEach(el => {
                el.innerHTML = el.dataset[lang];
            });

            document.documentElement.lang = lang;

            if (updateUrl) {
                const url = new URL(window.location);
                if (lang === 'en') {
                    url.searchParams.set('en', '');
                } else {
                    url.searchParams.delete('en');
                }
                window.history.replaceState({}, '', url);
            }
        }

        if (window.location.search.includes('en')) {
            setLanguage('en');
        } else {
            setLanguage('es');
        }

        document.querySelectorAll('.lang-toggle button').forEach(btn => {
            btn.addEventListener('click', () => setLanguage(btn.dataset.lang, true));
        });

        document.getElementById('bgVideo').playbackRate = 0.85;

        // Calendar link - opens two events: wedding + RSVP deadline
        document.getElementById('calendarLink').addEventListener('click', function(e) {
            e.preventDefault();
            window.open('https://calendar.google.com/calendar/render?action=TEMPLATE&text=Harry%20%26%20Carolina%27s%20Wedding&dates=20261018/20261019&details=Save%20the%20date%20for%20Harry%20and%20Carolina%27s%20wedding!&location=Madrid%2C%20Spain', '_blank');
            window.open('https://calendar.google.com/calendar/render?action=TEMPLATE&text=RSVP%20Deadline%20%E2%80%93%20Harry%20%26%20Carolina%27s%20Wedding&dates=20260401/20260402&details=Remember%20to%20RSVP%20for%20Harry%20and%20Carolina%27s%20wedding%20by%20today!', '_blank');
        });
    </script>

</body>

</html>
