<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harry & Carolina - Save the Date</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #F5E4C3;
            color: #90674D;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            line-height: 1.6;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 600px;
            animation: fadeIn 1.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .photo-frame {
            width: 220px;
            height: 220px;
            margin: 0 auto 2rem;
            border-radius: 50%;
            overflow: hidden;
            border: 6px solid #C99985;
            box-shadow: 0 8px 30px rgba(144, 103, 77, 0.2);
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .decorative-element {
            color: #A0A07D;
            font-size: 1.5rem;
            letter-spacing: 0.5rem;
            margin-bottom: 1rem;
        }

        .save-the-date {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.25rem;
            font-weight: 400;
            letter-spacing: 0.3rem;
            text-transform: uppercase;
            color: #A0A07D;
            margin-bottom: 1rem;
        }

        .names {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3.5rem;
            font-weight: 500;
            line-height: 0.9;
            margin-bottom: 1.5rem;
            color: #90674D;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .ampersand {
            font-size: 2.5rem;
            font-style: italic;
            font-weight: 400;
            color: #C99985;
            line-height: 1;
        }

        .date {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #90674D;
        }

        .location {
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: 0.15rem;
            margin-bottom: 2rem;
            color: #90674D;
        }

        .divider {
            width: 60px;
            height: 2px;
            background-color: #A0A07D;
            margin: 0 auto 2rem;
        }

        .tagline {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.125rem;
            color: #A0A07D;
        }

        /* Responsive styles */
        @media (max-width: 480px) {
            body {
                padding: 1.5rem;
            }

            .photo-frame {
                width: 180px;
                height: 180px;
                margin-bottom: 1.5rem;
            }

            .names {
                font-size: 2.5rem;
            }

            .ampersand {
                font-size: 1.75rem;
            }

            .date {
                font-size: 1.5rem;
            }

            .save-the-date {
                font-size: 1rem;
                letter-spacing: 0.2rem;
            }

            .decorative-element {
                font-size: 1.25rem;
                letter-spacing: 0.3rem;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="photo-frame">
            <img src="SCR-20260117-klsz.png" alt="Harry and Carolina">
        </div>

        <p class="decorative-element" aria-hidden="true">~ ~ ~</p>

        <p class="save-the-date">Save the Date</p>

        <h1 class="names">
            <span>Harry</span>
            <span class="ampersand">&</span>
            <span>Carolina</span>
        </h1>

        <p class="date">October 18th, 2026</p>

        <p class="location">Near Madrid, Spain</p>

        <div class="divider" aria-hidden="true"></div>

        <p class="tagline">Invitation to follow</p>
    </main>
</body>
</html>
